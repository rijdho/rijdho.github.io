<!doctype html>
<meta charset="utf-8">
<!-- Content-Security-Policy: the page loads only its own files. style-src-attr allows inline
style attributes, which the page writes as it renders (topic colours, the cloud legend);
removing it would mean one class per colour. Clickjacking stays uncovered: frame-ancestors
works only as a response header, and GitHub Pages sends none. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ricardo Hartley Belmar</title>
<!-- social:start -->
<!-- Generated by build_cv.py from data/cv.json. Do not edit by hand. -->
<meta name="description" content="Open Science Expert at the Interdisciplinary Transformation University Austria (IT:U), Linz: designing a university-wide open-science strategy and building the tools that run it.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ricardo Hartley Belmar">
<meta property="og:title" content="Ricardo Hartley Belmar">
<meta property="og:description" content="Open Science Expert at the Interdisciplinary Transformation University Austria (IT:U), Linz: designing a university-wide open-science strategy and building the tools that run it.">
<meta property="og:url" content="https://rijdho.github.io/">
<meta property="og:image" content="https://rijdho.github.io/docs/hub-cloud.png">
<meta property="og:image:width" content="1736">
<meta property="og:image:height" content="920">
<meta property="og:image:alt" content="The tool cloud on the hub: ovals grouped into four colour-coded topics, one per tool.">
<meta name="twitter:card" content="summary_large_image">
<!-- social:end -->
<!-- The family shell (a synced copy of rijdho/house-style: scripts/sync-house.mjs), then this page's own styles. -->
<link rel="stylesheet" href="./house/house.css?v=1">
<link rel="stylesheet" href="./hub.css?v=4">

<div class="app" id="app">
  <aside class="rail">
    <div class="brand-mark">
      <a class="brand-glyph" href="./" style="--glyph:'RH'" tabindex="-1" aria-hidden="true"></a>
      <div>
        <p class="brand-name"><a href="./" data-p="name">Ricardo Hartley Belmar</a></p>
        <a class="brand-sub" href="https://rijdho.github.io">rijdho.github.io</a>
      </div>
    </div>
    <!-- Built by renderNav() from TAB_GROUPS, then the tools: one entry per section. -->
    <nav id="railnav" aria-label="Sections"></nav>
  </aside>
  <button class="rail-backdrop" id="rail_backdrop" aria-label="Close menu" tabindex="-1"></button>

  <div class="main-col">
    <header class="cmdbar">
      <button class="menu-btn" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <!-- No title here: the section names itself in its own heading, right below. -->
      <span class="cmd-spacer"></span>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="de" aria-pressed="false">DE</button>
        <button data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button class="icbtn" id="theme" aria-label="Toggle theme">◑</button>
    </header>

    <main class="content"><div class="content-inner">
      <!-- The hero is the landing: it shows only while no section is chosen (no hash); the
           brand block in the rail leads back to it. -->
  <section class="hero" id="hero">
    <div class="eyebrow" data-p="kicker"></div>
    <!-- the name stays literal as well as data-p: it is the one line worth having in the
         raw HTML for anything that does not run the fetch. render() overwrites it. -->
    <h1 data-p="name">Ricardo Hartley Belmar</h1>
    <p class="tag" data-p="tagline"></p>
    <p class="sum" data-p="headline"></p>
    <div class="hlinks">
      <a class="chip primary" href="./cv.html" data-t="cv"></a>
      <!-- href and id are filled from cv.json by render(); the literals are the fallback
           for anything that reads the HTML without running the fetch. -->
      <a class="chip" id="orcid_chip" href="https://orcid.org/0000-0001-5058-9309">ORCID 0000-0001-5058-9309</a>
      <a class="chip" id="substack_chip" href="https://rijdho.substack.com">Substack</a>
    </div>
  </section>


      <section id="view_list">
        <div class="shead"><h2 id="view_h"></h2><span class="count" id="view_c"></span></div>
        <div class="tabpanel" id="tabpanel_main" tabindex="0"></div>
      </section>

  <section id="view_tools" hidden>
    <div class="shead">
      <h2 data-t="apps_h"></h2><span class="count" id="apps_c"></span>
    </div>
    <div class="subrow">
      <p class="lead" data-t="apps_lead"></p>
      <p class="lead tools-index"><span data-p="toolsIndexLabel"></span> <a id="tools_index" href="https://rijdho.github.io/metaudits-home/">rijdho.github.io/metaudits-home</a></p>
      <div class="seg viewseg" role="group" aria-label="View">
        <button data-view="cloud" data-t="cloud" aria-pressed="true"></button>
        <button data-view="list" data-t="list" aria-pressed="false"></button>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cloud" aria-label="Interactive cloud of tools grouped by topic"></canvas>
      <div class="legend" id="legend"></div>
      <div class="hint" data-t="hint"></div>
      <div class="omark" data-t="openmark"></div>
      <div class="tip" id="tip"></div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
    <div class="listwrap" id="listwrap"></div>
  </section>


    </div></main>

    <footer class="site-foot"><span data-t="by"></span> <span data-p="name"></span><span class="sep">·</span>
  <span data-t="lic"></span><span class="sep">·</span>
  <a href="https://github.com/rijdho/rijdho.github.io" data-t="src"></a><span class="sep">·</span>
  <span style="font-family:var(--mono);font-size:.76rem;color:var(--faint)" data-t="built"></span></footer>
  </div>
</div>

<script src="./hub.js?v=10"></script>
