name: Deploy to GitHub Pages

# Static multi-page site. Deploy via Actions (not the legacy Jekyll builder) so the
# folder is uploaded verbatim and CV.md is regenerated from data/cv.json on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # data/cv.json is edited by hand and three consumers index into it. A
      # malformed file was already caught, because build_cv.py parses it and a
      # failing step blocks the deploy; these catch the worse case, valid JSON
      # that is wrong, which otherwise fails in the visitor's browser in silence.
      # No package.json: Node's built-in runner, dependency-free, as in the
      # sibling repos.
      - run: node --test tests/*.test.mjs
      - name: Regenerate CV.md from data/cv.json
        run: python3 build_cv.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
